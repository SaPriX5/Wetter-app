<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Principe Wetter App</title>
<meta name="description" content="Wetter: DWD ICON-D2, MOSMIX, ECMWF, Regenradar.">
<meta name="theme-color" content="#111E3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Principe Wetter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <form id="searchForm" role="search" autocomplete="off">
    <svg class="mag" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Ort suchen" enterkeyhint="search" autocapitalize="words" aria-label="Ort suchen">
    <button type="button" id="clearQ" class="x" aria-label="Suche leeren" hidden>✕</button>
  </form>
  <button id="starBtn" class="ibtn" aria-label="Als Favorit speichern" hidden>☆</button>
  <button id="menuBtn" class="ibtn" aria-label="Info und Quellen">⋯</button>
  <ul id="results" hidden></ul>
</header>
<nav id="places" aria-label="Orte"></nav>
<main id="app" aria-live="polite"></main>
<dialog id="sheet"></dialog>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:1rem">Diese App braucht JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
